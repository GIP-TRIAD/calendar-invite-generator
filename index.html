<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Invite Generator</title>
<script>
// Apply the saved theme before first paint to avoid a flash.
(function () {
  try {
    var th = (JSON.parse(localStorage.getItem("icsSettings") || "{}") || {}).theme;
    if (typeof th !== "string" || !/^[a-z-]+$/.test(th) || th === "system") {
      th = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", th);
  } catch (e) {}
})();
</script>
<style>
  /* Themes. The data-theme attribute on <html> is set by script ("system" resolves to light or dark).
     Each theme defines: bg, card, text, muted, border, accent, accent-text, danger, success. */
  :root, :root[data-theme="light"] {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --border: #cfd5df;
    --accent: #1b5fd1; --accent-text: #ffffff; --danger: #c62828; --success: #2e7d32;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #14171d; --card: #1d222b; --text: #e6e9ef; --muted: #9aa3b2; --border: #3a4252;
    --accent: #5b9bff; --accent-text: #0c1018; --danger: #ff6b6b; --success: #5fcf80;
    color-scheme: dark;
  }
  /* Rosé Pine */
  :root[data-theme="rose-pine"] {
    --bg: #191724; --card: #1f1d2e; --text: #e0def4; --muted: #908caa; --border: #403d52;
    --accent: #c4a7e7; --accent-text: #191724; --danger: #eb6f92; --success: #9ccfd8;
    color-scheme: dark;
  }
  :root[data-theme="rose-pine-moon"] {
    --bg: #232136; --card: #2a273f; --text: #e0def4; --muted: #908caa; --border: #44415a;
    --accent: #c4a7e7; --accent-text: #232136; --danger: #eb6f92; --success: #9ccfd8;
    color-scheme: dark;
  }
  :root[data-theme="rose-pine-dawn"] {
    --bg: #faf4ed; --card: #fffaf3; --text: #575279; --muted: #6b6786; --border: #dfdad9;
    --accent: #286983; --accent-text: #faf4ed; --danger: #b4637a; --success: #56949f;
    color-scheme: light;
  }
  /* Nord */
  :root[data-theme="nord"] {
    --bg: #2e3440; --card: #3b4252; --text: #eceff4; --muted: #aab3c5; --border: #4c566a;
    --accent: #88c0d0; --accent-text: #2e3440; --danger: #bf616a; --success: #a3be8c;
    color-scheme: dark;
  }
  /* Dracula */
  :root[data-theme="dracula"] {
    --bg: #21222c; --card: #282a36; --text: #f8f8f2; --muted: #8f9acb; --border: #44475a;
    --accent: #bd93f9; --accent-text: #282a36; --danger: #ff5555; --success: #50fa7b;
    color-scheme: dark;
  }
  /* Catppuccin */
  :root[data-theme="catppuccin-latte"] {
    --bg: #e6e9ef; --card: #eff1f5; --text: #4c4f69; --muted: #5c5f77; --border: #bcc0cc;
    --accent: #8839ef; --accent-text: #eff1f5; --danger: #d20f39; --success: #40a02b;
    color-scheme: light;
  }
  :root[data-theme="catppuccin-frappe"] {
    --bg: #292c3c; --card: #303446; --text: #c6d0f5; --muted: #a5adce; --border: #51576d;
    --accent: #ca9ee6; --accent-text: #232634; --danger: #e78284; --success: #a6d189;
    color-scheme: dark;
  }
  :root[data-theme="catppuccin-macchiato"] {
    --bg: #1e2030; --card: #24273a; --text: #cad3f5; --muted: #a5adcb; --border: #494d64;
    --accent: #c6a0f6; --accent-text: #181926; --danger: #ed8796; --success: #a6da95;
    color-scheme: dark;
  }
  :root[data-theme="catppuccin-mocha"] {
    --bg: #181825; --card: #1e1e2e; --text: #cdd6f4; --muted: #a6adc8; --border: #45475a;
    --accent: #cba6f7; --accent-text: #11111b; --danger: #f38ba8; --success: #a6e3a1;
    color-scheme: dark;
  }
  :root {
    --error-bg: color-mix(in srgb, var(--danger) 18%, var(--card));
    --error-text: color-mix(in srgb, var(--danger) 45%, var(--text));
    --ok-bg: color-mix(in srgb, var(--success) 18%, var(--card));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
  input, textarea, select {
    width: 100%; padding: 9px 10px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  }
  textarea { min-height: 90px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  .datewrap { position: relative; }
  .datewrap input.date { padding-right: 42px; }
  .datewrap .pick {
    position: absolute; right: 2px; top: 2px; bottom: 2px; width: 38px; padding: 0;
    border: 0; background: transparent; color: var(--accent); font-size: 1.1rem; line-height: 1;
  }
  .datewrap input.native {
    position: absolute; right: 0; bottom: 0; width: 1px; height: 1px;
    opacity: 0; pointer-events: none; padding: 0; border: 0;
  }
  .timewrap { position: relative; }
  .timewrap input.time { padding-right: 36px; }
  .timewrap .tbtn {
    position: absolute; right: 2px; top: 2px; bottom: 2px; width: 32px; padding: 0;
    border: 0; background: transparent; color: var(--accent); font-size: 0.95rem; line-height: 1;
  }
  .tlist {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 10; margin: 2px 0 0; padding: 4px 0;
    list-style: none; max-height: 220px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  }
  .tlist[hidden] { display: none; }
  .tlist li { padding: 6px 12px; cursor: pointer; }
  .tlist li.sel { font-weight: 700; }
  .tlist li.active, .tlist li:hover { background: var(--accent); color: var(--accent-text); }
  button {
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 6px;
    border: 1px solid var(--accent); background: var(--accent);
    color: var(--accent-text); cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button.small { padding: 4px 10px; font-size: 0.85rem; }
  #lang { font-size: 16px; padding: 3px 6px; white-space: nowrap; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .themewrap { position: relative; }
  button.iconbtn { padding: 6px 9px; display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
  #themeMenu {
    position: absolute; right: 0; top: 100%; z-index: 20; margin: 4px 0 0; padding: 4px 0;
    list-style: none; min-width: 210px; max-height: 70vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
  }
  #themeMenu[hidden] { display: none; }
  #themeMenu button {
    display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent;
    color: var(--text); font-weight: 500; padding: 7px 14px;
  }
  #themeMenu button:hover, #themeMenu button:focus-visible { background: var(--accent); color: var(--accent-text); outline: none; }
  #themeMenu button[aria-checked="true"] { font-weight: 700; }
  #themeMenu button[aria-checked="true"]::before { content: "✓ "; }
  #themeMenu button[aria-checked="false"]::before { content: "\00a0\00a0 "; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .msg { padding: 10px 12px; border-radius: 6px; margin-top: 14px; display: none; }
  .msg.error { background: var(--error-bg); color: var(--error-text); display: block; }
  .msg.ok { background: var(--ok-bg); display: block; }
  .note { display: none; color: var(--error-text); font-size: 0.85rem; margin-top: 4px; }
  .note.show { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; }
  td.rm { width: 1%; text-align: right; white-space: nowrap; }
  .reftag { color: var(--muted); font-size: 0.8rem; margin-left: 6px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .zoneadd { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .zoneadd input { flex: 1 1 200px; width: auto; }
  pre.email {
    white-space: pre-wrap; margin: 0 0 10px; padding: 12px; border-radius: 6px;
    border: 1px solid var(--border); font: inherit; background: var(--bg);
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  button.chip {
    padding: 2px 8px; font-size: 0.85rem; font-weight: 500; background: transparent;
    color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  p.hint { margin: 8px 0 10px; }
  h2.gen { margin-top: 22px; }
  textarea[readonly], input[readonly] { background: var(--bg); }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1 data-i18n="heading"></h1>
    <div class="tools">
      <div class="themewrap" id="themeWrap">
        <button type="button" id="themeBtn" class="secondary iconbtn" aria-haspopup="menu" aria-expanded="false">
          <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
        <ul id="themeMenu" role="menu" hidden></ul>
      </div>
      <button type="button" id="lang" class="secondary" aria-label="English / 日本語" title="English / 日本語">あA</button>
    </div>
  </div>
  <p class="sub" data-i18n="sub"></p>

  <form id="form" class="card" autocomplete="off" novalidate>
    <label for="refTz" style="margin-top:0"><span data-i18n="fRefTz"></span> <span class="hint" data-i18n="fRefTzHint"></span></label>
    <input id="refTz" type="text" list="tzlist" spellcheck="false" autocapitalize="off">
    <div class="note" id="refNote"></div>

    <label for="title" data-i18n="fTitle"></label>
    <input id="title" type="text" data-i18n-ph="phTitle">

    <div class="row">
      <div>
        <label for="date" data-i18n="fDate"></label>
        <div class="datewrap">
          <input id="date" class="date" type="text" inputmode="numeric" maxlength="10" placeholder="yyyy/mm/dd">
          <button type="button" class="pick" id="pick" data-i18n-title="pickDate" aria-label="Calendar">📅</button>
          <input id="datePicker" class="native" type="date" tabindex="-1" aria-hidden="true">
        </div>
      </div>
      <div>
        <label for="start" data-i18n="fStart"></label>
        <div class="timewrap">
          <input id="start" class="time" type="text" inputmode="numeric" maxlength="5" placeholder="hh:mm"
                 role="combobox" aria-autocomplete="none" aria-expanded="false" aria-controls="startList">
          <button type="button" class="tbtn" tabindex="-1" data-i18n-title="pickTime" aria-label="Times">▾</button>
          <ul id="startList" class="tlist" role="listbox" hidden></ul>
        </div>
      </div>
      <div>
        <label for="end" data-i18n="fEnd"></label>
        <div class="timewrap">
          <input id="end" class="time" type="text" inputmode="numeric" maxlength="5" placeholder="hh:mm"
                 role="combobox" aria-autocomplete="none" aria-expanded="false" aria-controls="endList">
          <button type="button" class="tbtn" tabindex="-1" data-i18n-title="pickTime" aria-label="Times">▾</button>
          <ul id="endList" class="tlist" role="listbox" hidden></ul>
        </div>
      </div>
    </div>

    <label for="location"><span data-i18n="fLocation"></span> <span class="hint" data-i18n="fLocationHint"></span></label>
    <input id="location" type="text" placeholder="https://...">

    <label for="description"><span data-i18n="fDesc"></span> <span class="hint" data-i18n="fDescHint"></span></label>
    <textarea id="description"></textarea>

    <label for="reminder" data-i18n="fReminder"></label>
    <select id="reminder">
      <option value="" data-i18n="rNone"></option>
      <option value="15" data-i18n="r15"></option>
      <option value="30" data-i18n="r30"></option>
      <option value="60" data-i18n="r60"></option>
      <option value="1440" data-i18n="r1440"></option>
    </select>

    <div id="msg" class="msg" role="alert"></div>

    <div class="actions">
      <button type="submit" data-i18n="btnGenerate"></button>
      <button type="button" class="secondary" id="clearBtn" data-i18n="btnClear"></button>
    </div>
  </form>

  <section class="card" id="zonesCard">
    <h2 data-i18n="zonesHeading"></h2>
    <table>
      <thead><tr><th data-i18n="thZone"></th><th data-i18n="thTime"></th><th></th></tr></thead>
      <tbody id="zones"></tbody>
    </table>
    <div class="zoneadd">
      <input id="zoneInput" type="text" list="tzlist" spellcheck="false" autocapitalize="off" data-i18n-ph="phZone">
      <button type="button" class="secondary" id="zoneAdd" data-i18n="btnAddZone"></button>
      <button type="button" class="secondary" id="zoneReset" data-i18n="btnRestoreZones"></button>
    </div>
    <div class="note" id="zoneNote"></div>
  </section>

  <section class="card" id="emailCard">
    <h2><span data-i18n="emailHeading"></span> <span class="hint" data-i18n="emailHint"></span></h2>

    <label for="tplSubject" style="margin-top:0" data-i18n="tplSubject"></label>
    <input id="tplSubject" type="text" spellcheck="false">

    <label for="tplBody" data-i18n="tplBody"></label>
    <textarea id="tplBody" rows="5"></textarea>

    <div class="chips">
      <span class="hint" data-i18n="tplInsert"></span>
      <button type="button" class="chip" data-ph="{title}">{title}</button>
      <button type="button" class="chip" data-ph="{date}">{date}</button>
      <button type="button" class="chip" data-ph="{times}">{times}</button>
      <button type="button" class="chip" data-ph="{end_times}">{end_times}</button>
      <button type="button" class="chip" data-ph="{location}">{location}</button>
    </div>
    <p class="hint" data-i18n="tplHelp"></p>
    <button type="button" class="secondary small" id="tplReset" data-i18n="tplReset"></button>

    <h2 class="gen" data-i18n="genHeading"></h2>
    <label for="genSubject" style="margin-top:0" data-i18n="genSubject"></label>
    <input id="genSubject" type="text" readonly data-i18n-ph="phGenerated">
    <div class="actions"><button type="button" class="secondary" id="copySubject" data-copy="genSubject" data-i18n="btnCopySubject"></button></div>

    <label for="genBody" data-i18n="genBody"></label>
    <textarea id="genBody" rows="6" readonly data-i18n-ph="phGenerated"></textarea>
    <div class="actions"><button type="button" class="secondary" id="copyBody" data-copy="genBody" data-i18n="btnCopyBody"></button></div>
  </section>

  <datalist id="tzlist"></datalist>
</main>

<script>

      }
    }
    function pick(v) { input.value = v; setOpen(false); update(); }

    items.forEach(function (li) { li.addEventListener("click", function () { pick(li.textContent); }); });
    list.addEventListener("mousedown", function (e) { e.preventDefault(); }); // keep focus in the input
    btn.addEventListener("click", function () { setOpen(!isOpen()); input.focus(); });
    input.addEventListener("input", function () {
      input.value = fmtTimeDigits(input.value);
      if (isOpen()) { active = -1; mark(); }
      update();
    });
    input.addEventListener("blur", function () {
      var n = normTime(input.value);
      if (n) { input.value = n; update(); }
    });
    input.addEventListener("paste", function (e) {
      var text = (e.clipboardData || window.clipboardData).getData("text");
      e.preventDefault();
      input.value = normTime(text) || fmtTimeDigits(text);
      update();
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (!isOpen()) { setOpen(true); return; }
        var step = e.key === "ArrowDown" ? 1 : -1;
        active = active < 0 ? (step > 0 ? 0 : items.length - 1) : (active + step + items.length) % items.length;
        mark();
        if (items[active].scrollIntoView) items[active].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter" && isOpen() && active >= 0) {
        e.preventDefault();
        pick(items[active].textContent);
      } else if (e.key === "Escape" && isOpen()) {
        e.preventDefault();
        setOpen(false);
      } else if (e.key === "Tab") {
        setOpen(false);
      }
    });
    document.addEventListener("mousedown", function (e) {
      if (isOpen() && !input.parentNode.contains(e.target)) setOpen(false);
    });
  }
  buildTimeCombo("start");
  buildTimeCombo("end");

  (function buildTzList() {
    var list = [];
    try { if (Intl.supportedValuesOf) list = Intl.supportedValuesOf("timeZone").slice(); } catch (e) {}
    DEFAULT_ZONES.concat(["UTC"]).forEach(function (z) { if (list.indexOf(z) < 0) list.push(z); });
    list.sort();
    var dl = $("tzlist");
    list.forEach(function (z) {
      var o = document.createElement("option");
      o.value = z;
      dl.appendChild(o);
    });
  })();

  /* ---------- events ---------- */

  $("lang").addEventListener("click", function () {
    lang = lang === "en" ? "ja" : "en";
    settings.lang = lang;
    saveSettings();
    applyLang();
  });

  // Reference time zone
  function commitRef() {
    var el = $("refTz");
    var c = canonTz(el.value);
    if (!c) {
      setNote("refNote", "eTz", { tz: el.value.trim() });
      el.value = settings.refTz;
      return;
    }
    setNote("refNote", null);
    el.value = c;
    if (c !== settings.refTz) {
      settings.refTz = c;
      saveSettings();
      update();
    }
  }
  $("refTz").addEventListener("change", commitRef);
  $("refTz").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); commitRef(); }
  });

  // Date input
  $("date").addEventListener("input", function () {
    $("date").value = fmtDateDigits($("date").value);
    update();
  });
  $("date").addEventListener("blur", function () {
    var n = normDate($("date").value);
    if (n) { $("date").value = n; update(); }
  });
  $("date").addEventListener("paste", function (e) {
    var text = (e.clipboardData || window.clipboardData).getData("text");
    e.preventDefault();
    $("date").value = normDate(text) || fmtDateDigits(text);
    update();
  });
  $("pick").addEventListener("click", function () {
    var p = $("datePicker");
    var cur = parseDate($("date").value);
    p.value = cur ? cur[0] + "-" + pad2(cur[1]) + "-" + pad2(cur[2]) : "";
    try { p.showPicker(); } catch (e) { try { p.focus(); p.click(); } catch (e2) {} }
  });
  $("datePicker").addEventListener("change", function () {
    var v = $("datePicker").value;
    if (v) { $("date").value = v.replace(/-/g, "/"); update(); }
  });

  $("title").addEventListener("input", function () { renderEmail(compute()); });
  $("location").addEventListener("input", function () { renderEmail(compute()); });

  // Verification zone list
  function addZone() {
    var el = $("zoneInput");
    var raw = el.value.trim();
    if (!raw) return;
    var c = canonTz(raw);
    if (!c) { setNote("zoneNote", "eTz", { tz: raw }); return; }
    if (c === settings.refTz || settings.zones.indexOf(c) >= 0) { setNote("zoneNote", "eDup"); return; }
    settings.zones.push(c);
    saveSettings();
    el.value = "";
    setNote("zoneNote", null);
    renderOutput();
  }
  $("zoneAdd").addEventListener("click", addZone);
  $("zoneInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addZone(); }
  });
  $("zoneReset").addEventListener("click", function () {
    settings.zones = DEFAULT_ZONES.slice();
    saveSettings();
    setNote("zoneNote", null);
    renderOutput();
  });

  // Generate
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("title").value.trim();
    var dateStr = normDate($("date").value) || $("date").value.trim();
    $("date").value = dateStr;

    if (!title || !dateStr || !$("start").value || !$("end").value) { showMsg("eRequired", "error"); return; }
    if (!parseDate(dateStr)) { showMsg("eDate", "error"); return; }
    $("start").value = normTime($("start").value) || $("start").value.trim();
    $("end").value = normTime($("end").value) || $("end").value.trim();
    if (!parseTime($("start").value) || !parseTime($("end").value)) { showMsg("eTime", "error"); return; }
    var c = compute();
    if (c.gapErr) { showMsg("eGap", "error"); return; }
    if (c.orderErr || !c.start || !c.end) { showMsg("eOrder", "error"); return; }

    var ev = {
      title: title, start: c.start, end: c.end,
      location: $("location").value.trim(),
      description: $("description").value.trim(),
      reminder: $("reminder").value
    };
    var name = fileName(title, dateStr);
    download(name, buildIcs(ev));
    renderOutput();
    showMsg("ok", "ok", { name: name });
  });

  // Clear event fields only; saved settings (reference zone, zone list, language) are kept.
  // Note: a button with id="reset" would shadow form.reset(); fields are cleared explicitly.
  $("clearBtn").addEventListener("click", function () {
    ["title", "date", "datePicker", "location", "description"].forEach(function (id) { $(id).value = ""; });
    $("start").value = "";
    $("end").value = "";
    $("reminder").selectedIndex = 0;
    msgState = null;
    renderMsg();
    renderOutput();
    $("title").focus();
  });

  // Copy buttons for the generated subject and message.
  Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"), function (btn) {
    btn.addEventListener("click", function () {
      var text = $(btn.getAttribute("data-copy")).value;
      if (!text) return;
      var key = btn.getAttribute("data-i18n");
      function done() { btn.textContent = t("copied"); setTimeout(function () { btn.textContent = t(key); }, 1500); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {});
      } else {
        var ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (err) {}
        document.body.removeChild(ta);
      }
    });
  });

  // Email template editing (saved in the browser).
  var lastTpl = $("tplBody");
  $("tplSubject").addEventListener("focus", function () { lastTpl = $("tplSubject"); });
  $("tplBody").addEventListener("focus", function () { lastTpl = $("tplBody"); });
  $("tplSubject").addEventListener("input", function () {
    settings.subjectTpl = $("tplSubject").value; saveSettings(); renderEmail(compute());
  });
  $("tplBody").addEventListener("input", function () {
    settings.bodyTpl = $("tplBody").value; saveSettings(); renderEmail(compute());
  });
  Array.prototype.forEach.call(document.querySelectorAll("button.chip"), function (chip) {
    chip.addEventListener("mousedown", function (e) { e.preventDefault(); }); // keep cursor in the field
    chip.addEventListener("click", function () {
      var el = lastTpl, ph = chip.getAttribute("data-ph");
      var s = el.selectionStart, e = el.selectionEnd;
      if (typeof s !== "number") { s = e = el.value.length; }
      el.value = el.value.slice(0, s) + ph + el.value.slice(e);
      el.selectionStart = el.selectionEnd = s + ph.length;
      el.focus();
      el.dispatchEvent(new Event("input", { bubbles: true }));
    });
  });
  $("tplReset").addEventListener("click", function () {
    settings.subjectTpl = DEFAULT_SUBJECT_TPL;
    settings.bodyTpl = DEFAULT_BODY_TPL;
    $("tplSubject").value = settings.subjectTpl;
    $("tplBody").value = settings.bodyTpl;
    saveSettings();
    renderEmail(compute());
  });

  /* ---------- init ---------- */

  settings = loadSettings();
  lang = settings.lang;
  $("refTz").value = settings.refTz;
  applyTheme();
  $("tplSubject").value = settings.subjectTpl;
  $("tplBody").value = settings.bodyTpl;
  applyLang();
})();
</script>
</body>
</html>
